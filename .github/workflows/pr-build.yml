name: Build PR
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        env:
          NuGetPackageSourceCredentials_pa_nihr_crn: "Username=USERNAME;Password=${{ secrets.GITHUB_TOKEN }}"
        run: dotnet build --configuration Release
