name: Deploy Template

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      RDS_SECURITY_GROUP_ID:
        required: true
      RDS_ENDPOINT:
        required: true
      AWS_DB_SECRET_NAME:
        required: true
      AWS_SECRET_NAME:
        required: true

jobs:
  deploy:
    name: "Deploy ${{ inputs.environment }}"
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    
    env:
      ECS_TASK_DEFINITION: ${{ github.workspace }}/Nihr.Jdr.Dta.Infrastructure/.aws/ecs-task-definition.json
      CONTAINER_NAME: ${{ vars.ACCOUNT_PREFIX }}-ecs-${{ vars.ENVIRONMENT_STAGE }}-jdr-dta-container

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REPOSITORY: ${{ vars.ACCOUNT_PREFIX }}-ecr-repo-${{ vars.ENVIRONMENT_STAGE }}-jdr-dta
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME_TAG: jdr-dta
          IMAGE_SHA_TAG: jdr-dta-${{ github.sha }}
          NuGetPackageSourceCredentials_pa_nihr_crn: "Username=USERNAME;Password=${{ github.token }}"
        run: |
          docker build -f Nihr.Jdr.Dta.Job/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_NAME_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA_TAG" \
            --secret id=nuget-credentials-pa-nihr-crn,env=NuGetPackageSourceCredentials_pa_nihr_crn .
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Get AWS Account ID
        run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)" >> $GITHUB_ENV

      - name: Replace placeholders in task definition
        run: |
          sed -i "s/__ACCOUNT_ID__/${ACCOUNT_ID}/g" ${{ env.ECS_TASK_DEFINITION }}
          sed -i "s/__ENVIRONMENT__/${{ vars.ENVIRONMENT_STAGE }}/g" ${{ env.ECS_TASK_DEFINITION }}
          sed -i "s/__ACCOUNT_PREFIX__/${{ vars.ACCOUNT_PREFIX }}/g" ${{ env.ECS_TASK_DEFINITION }}

      - name: Fill in the new image ID
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.3
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            AwsSecretsManagerSettings__SecretName=${{ secrets.AWS_SECRET_NAME }}
            AwsSecretsManagerSettings__Enabled=${{ vars.SECRETS_ENABLED }}
            AwsSecretsManagerSettings__Region=${{ vars.AWS_REGION }}
            DOTNET_ENVIRONMENT=Production

      - name: Install sqlcmd
        run: |
          curl --proto '=https' --tlsv1.2 -L https://github.com/microsoft/go-sqlcmd/releases/download/v1.9.0/sqlcmd-linux-amd64.tar.bz2 | tar -xj
          sudo mv sqlcmd /usr/local/bin/

      - name: Get Public IP
        if: always()
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Whitelist Runner IP
        env:
          RDS_SECURITY_GROUP_ID: ${{ secrets.RDS_SECURITY_GROUP_ID }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ env.RDS_SECURITY_GROUP_ID }} \
            --protocol tcp --port 1433 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Get DB Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2.0.10
        with:
          secret-ids: |
            DB_CREDS, ${{ secrets.AWS_DB_SECRET_NAME }}
          parse-json-secrets: true

      - name: Run Migration Script
        run: |
          sqlcmd -S "${{ secrets.RDS_ENDPOINT }}" \
                 -U "${{ env.DB_CREDS_USERNAME }}" \
                 -P "${{ env.DB_CREDS_PASSWORD }}" \
                 -d "JdrDta" \
                 -i "./Nihr.Jdr.Dta.Infrastructure/DAL/Deployment/Deploy.sql"

      - name: Revoke Runner IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.RDS_SECURITY_GROUP_ID }} \
            --protocol tcp --port 1433 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.0
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ACCOUNT_PREFIX }}-ecs-service-${{ vars.ENVIRONMENT_STAGE }}-jdr-dta
          cluster: ${{ vars.ACCOUNT_PREFIX }}-ecs-cluster-${{ vars.ENVIRONMENT_STAGE }}-jdr-dta
          wait-for-service-stability: true