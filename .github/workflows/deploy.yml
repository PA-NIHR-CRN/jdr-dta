name: Deploy Job

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION_2: eu-west-2
  AwsSecretsManagerSettings__SecretName: ${{ secrets.AWS_SECRET_NAME }}
  AwsSecretsManagerSettings__Enabled: ${{ vars.SECRETS_ENABLED }}
  AwsSecretsManagerSettings__Region: ${{ vars.AWS_REGION }}
  DOTNET_ENVIRONMENT: "Production"

jobs:
  build:
    name: "Setup .NET"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

  deploy-uat:
    needs: [build]
    environment: UAT
    name: "Deploy UAT"
    runs-on: ubuntu-latest
    steps:
      - name: Check Variables
        run: |
          echo "AwsSecretsManagerSettings__Enabled: $AwsSecretsManagerSettings__Enabled"
          echo "AwsSecretsManagerSettings__Region: $AwsSecretsManagerSettings__Region"
          echo "DOTNET_ENVIRONMENT: $DOTNET_ENVIRONMENT"

      - uses: actions/checkout@v3

      - name: Configure AWS credentials (uat)
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8
        with:
          aws-access-key-id: ${{ secrets.CRNCC_STAGING_IAM_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CRNCC_STAGING_IAM_ACCESS_KEY_SECRET }}
          aws-region: ${{ env.AWS_REGION_2 }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REPOSITORY: crnccs-ecr-repo-uat-jdr-dta
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME_TAG: jdr-dta
          IMAGE_SHA_TAG: jdr-dta-${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_SECRET_NAME: ${{ secrets.AWS_SECRET_NAME }}
        run: |
          pwd
          ls -la
          echo "Using registry ${{ env.ECR_REGISTRY }}"
          echo "Tagging image with ${{ env.IMAGE_NAME_TAG}} and ${{ env.IMAGE_SHA_TAG }}"

          docker build -f Nihr.Jdr.Dta.Job/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_NAME_TAG --build-arg NUGET_PACKAGE_USERNAME=USERNAME --build-arg NUGET_PACKAGE_TOKEN="$GITHUB_TOKEN" --build-arg AWS_SECRET=$AWS_SECRET_NAME --build-arg AWS_REGION="${{ vars.AWS_REGION }}" --build-arg SECRETS_ENABLED=${{ vars.SECRETS_ENABLED }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA_TAG .
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Get AWS Account ID
        run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)" >> $GITHUB_ENV

      - name: Replace placeholder in task definition
        run: |
          sed -i "s/{{ACCOUNT_ID}}/${ACCOUNT_ID}/g" /home/runner/work/jdr-dta/jdr-dta/Nihr.Jdr.Dta.Infrastructure/.aws/ecs-task-definition-uat.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        env:
          ECS_TASK_DEFINITION: /home/runner/work/jdr-dta/jdr-dta/Nihr.Jdr.Dta.Infrastructure/.aws/ecs-task-definition-uat.json
          CONTAINER_NAME: crnccs-ecs-uat-jdr-dta-container
        uses: aws-actions/amazon-ecs-render-task-definition@5cb8c74c1b1ecaec4c8ea82eff82c009333509ce
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            AwsSecretsManagerSettings__SecretName=${{ secrets.AWS_SECRET_NAME }}
            AwsSecretsManagerSettings__Enabled=${{ vars.SECRETS_ENABLED }}
            AwsSecretsManagerSettings__Region=${{ vars.AWS_REGION }}
            DOTNET_ENVIRONMENT=Production

      - name: Deploy Amazon ECS task definition
        env:
          ECS_SERVICE: crnccs-ecs-service-uat-jdr-dta
          ECS_CLUSTER: crnccs-ecs-cluster-uat-jdr-dta
        uses: aws-actions/amazon-ecs-deploy-task-definition@1beffbdddb3eb5f83c7a746c3e9bafeccdccbbaa
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
