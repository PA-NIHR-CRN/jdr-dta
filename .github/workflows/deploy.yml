name: Deploy Job

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-uat:
    environment: UAT
    name: "Deploy UAT"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials (UAT)
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8
        with:
          aws-access-key-id: ${{ secrets.CRNCC_STAGING_IAM_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CRNCC_STAGING_IAM_ACCESS_KEY_SECRET }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REPOSITORY: crnccs-ecr-repo-uat-jdr-dta
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME_TAG: jdr-dta
          IMAGE_SHA_TAG: jdr-dta-${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using registry ${{ env.ECR_REGISTRY }}"
          echo "Tagging image with ${{ env.IMAGE_NAME_TAG }} and ${{ env.IMAGE_SHA_TAG }}"

          docker build -f Nihr.Jdr.Dta.Job/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_NAME_TAG" --build-arg "NUGET_PACKAGE_USERNAME=USERNAME" --build-arg "NUGET_PACKAGE_TOKEN=$GITHUB_TOKEN" -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA_TAG" .
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Get AWS Account ID
        run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)" >> $GITHUB_ENV

      - name: Replace placeholder in task definition
        run: |
          sed -i "s/{{ACCOUNT_ID}}/${ACCOUNT_ID}/g" /home/runner/work/jdr-dta/jdr-dta/Nihr.Jdr.Dta.Infrastructure/.aws/ecs-task-definition-uat.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        env:
          ECS_TASK_DEFINITION: /home/runner/work/jdr-dta/jdr-dta/Nihr.Jdr.Dta.Infrastructure/.aws/ecs-task-definition-uat.json
          CONTAINER_NAME: crnccs-ecs-uat-jdr-dta-container
        uses: aws-actions/amazon-ecs-render-task-definition@5cb8c74c1b1ecaec4c8ea82eff82c009333509ce
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            AwsSecretsManagerSettings__SecretName=${{ secrets.AWS_SECRET_NAME }}
            AwsSecretsManagerSettings__Enabled=${{ vars.SECRETS_ENABLED }}
            AwsSecretsManagerSettings__Region=${{ vars.AWS_REGION }}
            DOTNET_ENVIRONMENT=Production

      - name: Get Public IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Whitelist Runner IP
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.RDS_SECURITY_GROUP_ID }} \
            --protocol tcp --port 1433 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Get DB Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802
        with:
          secret-ids: |
            DB_CREDS, ${{ secrets.AWS_DB_SECRET_NAME }}
          parse-json-secrets: true

      - name: Run SQL Deployment Script
        uses: azure/sql-action@v2.3
        with:
          connection-string: "${{ env.DB_CREDS_CONNECTION_STRING }}"
          path: "./Nihr.Jdr.Dta.Infrastructure/DAL/Deployment/Deploy.sql"

      # - name: Run SQL Deployment Script
      #   run: |
      #     sqlcmd -S "${{ secrets.RDS_ENDPOINT }}" \
      #            -U "${{ env.DB_CREDS_USERNAME }}" \
      #            -P "${{ env.DB_CREDS_PASSWORD }}" \
      #            -d "JdrDta" \
      #            -i "./Nihr.Jdr.Dta.Infrastructure/DAL/Deployment/Deploy.sql"

      # 6. Cleanup: Remove IP from Security Group (Runs even if previous steps fail)
      - name: Revoke Runner IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.RDS_SECURITY_GROUP_ID }} \
            --protocol tcp --port 1433 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Deploy Amazon ECS task definition
        env:
          ECS_SERVICE: crnccs-ecs-service-uat-jdr-dta
          ECS_CLUSTER: crnccs-ecs-cluster-uat-jdr-dta
        uses: aws-actions/amazon-ecs-deploy-task-definition@1beffbdddb3eb5f83c7a746c3e9bafeccdccbbaa
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
